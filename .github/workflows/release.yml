# Release: pushing a version tag (git tag v1.2.0 && git push origin v1.2.0)
# re-runs CI, publishes the image to GitHub Container Registry and deploys it.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      # Image names must be lowercase; the repo name (Semantic-Search) is not.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # no personal token needed
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> tags 1.2.3, 1.2 and latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: publish
    # Turn on by setting the repository variable DEPLOY_ENABLED=true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A GitHub "environment" holds the production secrets and can require a
    # manual approval before this job runs (Settings > Environments).
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Trigger deploy
        # Most container hosts (Render, Railway, Koyeb, Coolify, ...) give you
        # a deploy hook URL. Store it as the DEPLOY_HOOK_URL environment secret.
        run: curl --fail-with-body -sS -X POST "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      - name: Verify the new version is healthy
        if: vars.PRODUCTION_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.PRODUCTION_URL }}/health" && exit 0
            sleep 10
          done
          echo "Deployment did not become healthy" >&2
          exit 1
