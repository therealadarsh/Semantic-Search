# Runs on every `git commit` after `pre-commit install` (done by `make install`).
# Model files and data are third-party artifacts: leave their bytes alone.
exclude: ^(models|data)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4 # keep in sync with ruff in requirements-dev.txt
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
